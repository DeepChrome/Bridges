# Bridges feedback Worker. Secrets are never here: `wrangler secret put` sets
# ANTHROPIC_API_KEY and APP_TOKEN on the deployed Worker; for `wrangler dev`, put
# them in backend/.dev.vars (gitignored).
name = "bridges-feedback"
main = "src/index.js"
compatibility_date = "2026-09-01"

# The daily counter and token log. Create once with
#   wrangler kv namespace create USAGE
# and paste the id it prints here.
[[kv_namespaces]]
binding = "USAGE"
id = "b604658a70984d208e21ea65006f01d0"

# Sync (2026-11-07, src/sync.js): a learner's profile, one Durable Object per
# account with its own SQLite, and one object for the pairing codes. The
# classes are exported from src/index.js; `new_sqlite_classes` is what gives
# them SQL storage (the key-value kind cannot hold rows).
[[durable_objects.bindings]]
name = "SYNC"
class_name = "SyncAccount"

[[durable_objects.bindings]]
name = "PAIR"
class_name = "Pairings"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SyncAccount", "Pairings"]

[vars]
MODEL = "claude-haiku-4-5-20251001"
# The grammar answers (/v1/ask) run on a stronger model: the old one invented
# Russian forms (2026-11-23). Thinking always on; effort steers its depth.
ASK_MODEL = "claude-opus-5-5"
ASK_EFFORT = "low"
# The personal tutor too (2026-11-24, the owner's call): about 2c a turn.
TUTOR_MODEL = "claude-opus-5-5"
TUTOR_EFFORT = "low"
DAILY_CAP = "300"
# Conversation turns a day for one user: a backstop against a runaway loop, not a
# budget — the owner lifted the three-sessions limit on 2026-09-07.
TALK_DAILY_CAP = "240"
# Model calls a day across every registered install together (ROADMAP 13.39).
# The owner's own token is outside it. At Haiku's prices this is a few dollars
# a day at the very worst. Registrations: REGISTER_IP_CAP (5) and
# REGISTER_DAILY_CAP (100) default in src/index.js and can be set here.
# The owner's budget for the public beta (2026-10-03): under $100 a month.
# The dearest call, a conversation turn, costs about $0.004 at Haiku's prices,
# so 750 a day is about $3 a day — $90 a month — if every one were the
# dearest. Most are explanations at a quarter of that.
GLOBAL_DAILY_CAP = "750"
# Beta only: an install may switch itself between Free and Premium
# (POST /v1/plan { set }). Turn this off before Premium is sold —
# docs/BETA.md, Phase E. GLOBAL_DAILY_CAP above still bounds the spend.
BETA_SELF_PLAN = "true"
# Beta only: every registered install is on Premium's allowance (and the
# self-serve switch is not offered). Turn off before Premium is sold.
BETA_PREMIUM = "true"
