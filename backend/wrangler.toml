# Bridges feedback Worker. Secrets are never here: `wrangler secret put` sets
# ANTHROPIC_API_KEY and APP_TOKEN on the deployed Worker; for `wrangler dev`, put
# them in backend/.dev.vars (gitignored).
name = "bridges-feedback"
main = "src/index.js"
compatibility_date = "2026-09-01"

# The daily counter and token log. Create once with
#   wrangler kv namespace create USAGE
# and paste the id it prints here.
[[kv_namespaces]]
binding = "USAGE"
id = "b604658a70984d208e21ea65006f01d0"

[vars]
MODEL = "claude-haiku-4-5-20251001"
DAILY_CAP = "300"
# Conversation turns a day for one user: a backstop against a runaway loop, not a
# budget — the owner lifted the three-sessions limit on 2026-09-07.
TALK_DAILY_CAP = "240"
# Model calls a day across every registered install together (ROADMAP 13.39).
# The owner's own token is outside it. At Haiku's prices this is a few dollars
# a day at the very worst. Registrations: REGISTER_IP_CAP (5) and
# REGISTER_DAILY_CAP (100) default in src/index.js and can be set here.
GLOBAL_DAILY_CAP = "1500"
