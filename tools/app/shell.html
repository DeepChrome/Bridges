<div id="splash" aria-hidden="true">
  <div class="splash-mark">
    <span class="bar b1"></span>
    <span class="bar b2"></span>
    <span class="bar b3"></span>
  </div>
  <div class="splash-name">Bridges</div>
  <div class="splash-sub">Russian, from your own words</div>
</div>

<div id="app">
  <header class="topbar">
    <button class="iconbtn" id="back" aria-label="Back" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round">
        <path d="M15 5l-7 7 7 7"></path>
      </svg>
    </button>
    <h1 id="title">Learn</h1>
    <span class="devbadge" id="devbadge" hidden>dev</span>
    <button class="iconbtn me" id="me" aria-label="Your profile"></button>
    <button class="iconbtn" id="cog" aria-label="Settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"
           stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"></circle>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
      </svg>
    </button>
  </header>

  <main id="s-path"></main>
  <main id="s-lesson" hidden></main>
  <main id="s-practice" hidden></main>
  <main id="s-drills" hidden></main>
  <main id="s-immerse" hidden></main>
  <main id="s-dict" hidden></main>
  <main id="s-you" hidden></main>

  <nav class="tabbar" id="tabs">
    <button data-go="path" aria-current="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"
           stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 19V6a2 2 0 0 1 2-2h5v15H6a2 2 0 0 0-2 2z"></path>
        <path d="M20 19V6a2 2 0 0 0-2-2h-5v15h5a2 2 0 0 1 2 2z"></path>
      </svg>
      Learn
    </button>
    <button data-go="practice">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"
           stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="6" width="14" height="12" rx="2"></rect>
        <path d="M7 3h14a2 2 0 0 1 2 2v11"></path>
      </svg>
      Study
    </button>
    <button data-go="drills">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"
           stroke-linecap="round" stroke-linejoin="round">
        <path d="M6 9v6M18 9v6M4 11v2M20 11v2M8 7v10M16 7v10M8 12h8"></path>
      </svg>
      Practice
    </button>
    <button data-go="immerse">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"
           stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="5" width="18" height="14" rx="3"></rect>
        <path d="m11 9.5 4 2.5-4 2.5z"></path>
      </svg>
      Immerse
    </button>
    <button data-go="dict">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"
           stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="7"></circle>
        <path d="m20 20-3.5-3.5"></path>
      </svg>
      Search
    </button>
  </nav>
</div>
<div id="pop" role="tooltip"></div>
